; PgBouncer for FDDT — TRANSACTION pooling in front of PostgreSQL.
;
; The app's two roles (fddt_app, fddt_platform) connect here instead of to
; Postgres directly (DATABASE_POOLER_HOST / DATABASE_POOLER_PORT in
; backend/.env), and each process keeps no pool of its own (SQLAlchemy
; NullPool). Alembic/seed (the owner, DATABASE_URL) still connect directly.
;
; Transaction mode is compatible with the tenant context: the app sets
; app.current_company_id with set_config(..., is_local => true), which lives
; only until the transaction ends — the moment PgBouncer may give the server
; connection to another client. Verified by tests/test_pgbouncer_rls.py,
; which also shows a session-level setting WOULD leak (so the test can tell).
; Never use plain SET / set_config(..., false) for tenant state.
;
; Sizing (see docs/processing-queues.md, "Database connections"):
;   default_pool_size  server connections per (database, user) pair
;   max_client_conn    client connections PgBouncer accepts in total
; Postgres max_connections must be >= sum of pool sizes + reserve + admin slack.

[databases]
docauth = host=postgres port=5432 dbname=docauth
; Single-server-connection alias used ONLY by tests/test_pgbouncer_rls.py to
; force connection reuse deterministically.
docauth_reuse_probe = host=postgres port=5432 dbname=docauth pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 1000
max_db_connections = 60
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin
log_connections = 0
log_disconnections = 0
