services:
  # ---------------------------------------------------------------------------
  # Backend API (FastAPI / Uvicorn)
  # Connects directly to the cloud Neon PostgreSQL database (DATABASE_URL in .env)
  # and the local Redis container for caching and Celery queues.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fddt-backend:local
    container_name: docauth-backend
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && python seed.py && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    env_file: ./backend/.env
    environment:
      # DATABASE_URL is read from ./backend/.env (pointing to Neon)
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Language files of the Tesseract installed in the image (backend/.env
      # points at a folder that only exists outside Docker).
      TESSDATA_DIR: /usr/share/tesseract-ocr/5/tessdata
    ports:
      - "8000:8000"
    volumes:
      - app_storage:/app/local_storage
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        # Sync backend app code live — Uvicorn with --reload reloads immediately
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/alembic.ini
          target: /app/alembic.ini
        # Rebuild container image if python dependencies change
        - action: rebuild
          path: ./backend/requirements.txt

  # ---------------------------------------------------------------------------
  # Frontend (React / Vite built into Nginx reverse proxy)
  # Proxies /api requests to http://backend:8000.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fddt-frontend:local
    container_name: docauth-frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    develop:
      watch:
        # Rebuild and reload the frontend Nginx bundle when source files change
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/public
        - action: rebuild
          path: ./frontend/index.html
        - action: rebuild
          path: ./frontend/package.json

  # ---------------------------------------------------------------------------
  # Redis (In-memory broker for Celery queues and sign-in rate limiting)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: docauth-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Processing workers (optional, local) — run with `--profile workers`
  # e.g.: docker compose --profile workers up --watch
  # ---------------------------------------------------------------------------
  extraction-worker: &worker
    profiles: ["workers"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fddt-backend:local
    command: ["sh", "start-worker.sh", "extraction"]
    env_file: ./backend/.env
    environment: &worker_env
      # Connects to Neon database from backend/.env and Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Language files of the Tesseract installed in the image (backend/.env
      # points at a folder that only exists outside Docker).
      TESSDATA_DIR: /usr/share/tesseract-ocr/5/tessdata
    volumes:
      - app_storage:/app/local_storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/requirements.txt

  vision-worker:
    <<: *worker
    command: ["sh", "start-worker.sh", "vision"]

  forensics-worker:
    <<: *worker
    command: ["sh", "start-worker.sh", "forensics"]
    cpus: ${FORENSICS_WORKER_CPUS:-2}

  beat:
    <<: *worker
    command: ["sh", "start-beat.sh"]

volumes:
  redis_data:
  app_storage:
